<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAZY LATE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: sans-serif;
    }

    /* big faint LATE watermarks in the background */
    body::before,
    body::after {
      content: 'LATE';
      position: fixed;
      font-size: 180px;
      font-weight: 900;
      font-family: 'Impact', 'Arial Black', sans-serif;
      color: #ff3b3b;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
      white-space: nowrap;
    }
    body::before {
      top: -40px;
      left: -40px;
      transform: rotate(-8deg);
    }
    body::after {
      bottom: -40px;
      right: -40px;
      transform: rotate(5deg);
      color: #ffe600;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 32px;
      text-align: center;
    }

    /* images */
    .img-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .img-row img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      border: 3px solid #1e1e1e;
      filter: saturate(1.15) contrast(1.05);
      display: block;
    }

    .img-row img:nth-child(1) { object-position: 20% center; }
    .img-row img:nth-child(2) { object-position: center center; }
    .img-row img:nth-child(3) { object-position: 80% 70%; }

    /* text */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .line1 {
      font-size: clamp(40px, 10vw, 72px);
      font-weight: 900;
      font-family: 'Impact', 'Arial Black', sans-serif;
      color: #ff3b3b;
      letter-spacing: 6px;
      text-shadow: 4px 4px 0 #ff000033;
      text-transform: uppercase;
    }

    .line2 {
      font-size: clamp(20px, 5vw, 36px);
      font-weight: 900;
      color: #ffe600;
      letter-spacing: 8px;
      font-family: 'Courier New', 'Courier', monospace;
      text-transform: uppercase;
    }

    .line3 {
      font-size: clamp(24px, 6vw, 48px);
      font-weight: 900;
      color: #00ffcc;
      letter-spacing: 4px;
      font-family: 'Georgia', serif;
      text-shadow: 3px 3px 0 #00ffcc22;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="img-row">
      <img
        src="https://upload.wikimedia.org/wikipedia/en/d/dd/The_Persistence_of_Memory.jpg"
        alt="The Persistence of Memory by Salvador Dali">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/d/de/Salvador.Dali-Profile.of.Time.JPG"
        alt="Profile of Time by Salvador Dali">
      <img
        src="https://upload.wikimedia.org/wikipedia/en/d/dd/The_Persistence_of_Memory.jpg"
        alt="The Persistence of Memory detail">
    </div>

    <div class="text-block">
      <div class="line1">LAZY LATE</div>
      <div class="line2">I AM SORRY</div>
      <div class="line3">YOU ARE LOVED.</div>
    </div>

  </div>
</body>
</html>
