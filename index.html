<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAZY LATE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 80px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 32px;
      text-align: center;
    }

    /* images */
    .img-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .img-row img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      border: 3px solid #1e1e1e;
      filter: saturate(1.15) contrast(1.05);
      display: block;
    }

    .img-row img:nth-child(1) { object-position: 20% center; }
    .img-row img:nth-child(2) { object-position: center center; }
    .img-row img:nth-child(3) { object-position: 80% 70%; }

    /* text */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    @keyframes colorFlash {
      0%   { color: #00f0ff; text-shadow: 4px 4px 0 #00f0ff33; }
      25%  { color: #ff3b3b; text-shadow: 4px 4px 0 #ff000033; }
      50%  { color: #00f0ff; text-shadow: 4px 4px 0 #00f0ff33; }
      75%  { color: #ffe600; text-shadow: 4px 4px 0 #ffe60033; }
    }

    .line1 {
      font-size: clamp(40px, 10vw, 72px);
      font-weight: 900;
      font-family: 'Impact', 'Arial Black', sans-serif;
      letter-spacing: 6px;
      text-transform: uppercase;
      animation: colorFlash 1s steps(1) infinite;
    }

    .line2 {
      font-size: clamp(20px, 5vw, 36px);
      font-weight: 900;
      color: #ffe600;
      letter-spacing: 8px;
      font-family: 'Courier New', 'Courier', monospace;
      text-transform: uppercase;
    }

    .music-btn {
      background: none;
      border: 3px solid #ffe600;
      color: #ffe600;
      font-family: 'Courier New', monospace;
      font-size: clamp(14px, 4vw, 20px);
      font-weight: 900;
      letter-spacing: 3px;
      padding: 14px 24px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      transition: background 0.1s, color 0.1s;
    }

    .music-btn:active {
      background: #ffe600;
      color: #0a0a0a;
    }

    .line3 {
      font-size: clamp(24px, 6vw, 48px);
      font-weight: 900;
      color: #00ffcc;
      letter-spacing: 4px;
      font-family: 'Georgia', serif;
      text-shadow: 3px 3px 0 #00ffcc22;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="img-row">
      <img
        src="images/dali-clocks.jpg"
        alt="The Persistence of Memory by Salvador Dali">
      <img
        src="images/snail-original.jpg"
        alt="A snail">
      <img
        src="images/turtle-2.jpg"
        alt="A turtle">
    </div>

    <div class="text-block">
      <div class="line1">LAZY LATE</div>
      <div class="line2">I AM SORRY</div>
      <div class="line3">YOU ARE LOVED.</div>
    </div>

    <button class="music-btn" onclick="toggleMusic(this)">🎵 PLAY SILLY MUSIC</button>

  </div>
  <audio id="bg-music" src="sounds/music.mp3" loop></audio>

  <script>
    const audio = document.getElementById('bg-music');
    audio.volume = 1;

    function toggleMusic(btn) {
      if (audio.paused) {
        audio.play();
        btn.textContent = '🔇 STOP THE MUSIC';
      } else {
        audio.pause();
        btn.textContent = '🎵 PLAY SILLY MUSIC';
      }
    }
  </script>
</body>
</html>
